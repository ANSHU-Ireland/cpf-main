AWSTemplateFormatVersion: '2010-09-09'
Description: CPF UAT/production-shaped AWS platform (ECS Fargate, RDS PostgreSQL, S3, WAF and operations controls).

Parameters:
  ProjectName:
    Type: String
    Default: cpf
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
  EnvironmentName:
    Type: String
    Default: uat
    AllowedValues: [uat, production]
  ImageUri:
    Type: String
    Description: Immutable ECR image URI including a non-latest tag.
    AllowedPattern: '^.+:[A-Za-z0-9._-]+$'
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN. Required for an internet-facing production deployment.
  DomainName:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 20
  WorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.medium
  DatabaseAllocatedStorage:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 16384
  DatabaseDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  AlertEmail:
    Type: String
    Default: ''

Conditions:
  IsUat: !Equals [!Ref EnvironmentName, uat]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  CreateDnsRecord: !And [!Condition HasDomainName, !Condition HasHostedZone]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  ProtectDatabase: !Equals [!Ref DatabaseDeletionProtection, 'true']

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${ProjectName}-${EnvironmentName} application data encryption'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: CloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cpf/${EnvironmentName}/*'

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${EnvironmentName}-data'
      TargetKeyId: !Ref DataKey

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}' }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-igw' }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-public-a' }
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-public-b' }
  ApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-app-a' }
  ApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-app-b' }
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.20.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-db-a' }
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.21.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-${EnvironmentName}-db-b' }

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties: { Domain: vpc }
  NatEipB:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties: { Domain: vpc }
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  ApplicationRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  ApplicationRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  ApplicationDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ApplicationRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  ApplicationDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref ApplicationRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB
  ApplicationRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ApplicationSubnetA, RouteTableId: !Ref ApplicationRouteTableA }
  ApplicationRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref ApplicationSubnetB, RouteTableId: !Ref ApplicationRouteTableB }

  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DatabaseRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DatabaseSubnetA, RouteTableId: !Ref DatabaseRouteTable }
  DatabaseRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref DatabaseSubnetB, RouteTableId: !Ref DatabaseRouteTable }

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/cpf/${EnvironmentName}/vpc-flow'
      RetentionInDays: 90
      KmsKeyId: !GetAtt DataKey.Arn
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishVpcFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  [
                    logs:CreateLogStream,
                    logs:PutLogEvents,
                    logs:DescribeLogGroups,
                    logs:DescribeLogStreams,
                  ]
                Resource: !GetAtt FlowLogGroup.Arn
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      MaxAggregationInterval: 60
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entrypoint
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - !If
          - HasCertificate
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CPF Fargate tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 4300,
            ToPort: 4300,
            SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup,
          }
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CPF PostgreSQL from application tasks only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 5432,
            ToPort: 5432,
            SourceSecurityGroupId: !Ref ApplicationSecurityGroup,
          }
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
          - Id: NoncurrentRetention
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 365 }
            NoncurrentVersionTransitions:
              - { StorageClass: GLACIER, TransitionInDays: 90 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CPF isolated database subnets
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: CPF PostgreSQL security and observability settings
      Parameters:
        rds.force_ssl: '1'
        log_connections: '1'
        log_disconnections: '1'
        log_lock_waits: '1'
        log_min_duration_statement: '1000'
        idle_in_transaction_session_timeout: '60000'
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${EnvironmentName}'
      Engine: postgres
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: cpf
      Port: 5432
      MasterUsername: cpfadmin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !GetAtt DataKey.Arn
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      MaxAllocatedStorage: 1000
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !GetAtt DataKey.Arn
      MultiAZ: true
      BackupRetentionPeriod: 30
      CopyTagsToSnapshot: true
      DeleteAutomatedBackups: false
      DeletionProtection: !If [ProtectDatabase, true, false]
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt DataKey.Arn
      PerformanceInsightsRetentionPeriod: 7
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false

  ApplicationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/database/runtime'
      Description: CPF non-owner runtime database credentials
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username":"cpf_runtime"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludeCharacters: '"@/\\'

  ImportDataKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/encryption/import'
      Description: CPF candidate-import envelope encryption key
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: key
        PasswordLength: 64
        ExcludePunctuation: true
  IntegrationDataKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/encryption/integration'
      Description: CPF integration-secret envelope encryption key
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: key
        PasswordLength: 64
        ExcludePunctuation: true

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${EnvironmentName}'
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: FARGATE, Weight: 1 }

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/cpf/${EnvironmentName}/web'
      RetentionInDays: 90
      KmsKeyId: !GetAtt DataKey.Arn
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/cpf/${EnvironmentName}/api'
      RetentionInDays: 90
      KmsKeyId: !GetAtt DataKey.Arn
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/cpf/${EnvironmentName}/migration'
      RetentionInDays: 365
      KmsKeyId: !GetAtt DataKey.Arn
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/cpf/${EnvironmentName}/worker'
      RetentionInDays: 90
      KmsKeyId: !GetAtt DataKey.Arn

  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}'
  EventArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub '${ProjectName}-${EnvironmentName}'
      SourceArn: !GetAtt EventBus.Arn
      RetentionDays: 90

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadCpfDatabaseSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApplicationDatabaseSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref ImportDataKeySecret
                  - !Ref IntegrationDataKeySecret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ArtifactObjectAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${ArtifactBucket.Arn}/*'
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventBus.Arn

  ApplicationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-application'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          Command: [node, apps/server/node_modules/tsx/dist/cli.mjs, apps/server/src/index.ts]
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp, Name: api }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: APP_ENV, Value: !Ref EnvironmentName }
            - { Name: CPF_DEMO_MODE, Value: !If [IsUat, 'true', 'false'] }
            - { Name: CPF_DB_ROLE, Value: cpf_app }
            - {
                Name: CPF_ALLOWED_ORIGIN,
                Value:
                  !If [
                    HasDomainName,
                    !Sub 'https://${DomainName}',
                    !Sub 'http://${LoadBalancer.DNSName}',
                  ],
              }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: '3000' }
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: cpf }
            - { Name: PGSSL, Value: 'true' }
            - {
                Name: PGSSLROOTCERT,
                Value: /usr/local/share/ca-certificates/aws-rds-global-bundle.pem,
              }
            - { Name: PGPOOL_MAX, Value: '15' }
            - { Name: PGAPPNAME, Value: cpf-api }
            - { Name: CPF_ARTIFACT_BUCKET, Value: !Ref ArtifactBucket }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${ApplicationDatabaseSecret}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${ApplicationDatabaseSecret}:password::' }
            - { Name: CPF_IMPORT_DATA_KEY, ValueFrom: !Sub '${ImportDataKeySecret}:key::' }
            - {
                Name: CPF_INTEGRATION_DATA_KEY,
                ValueFrom: !Sub '${IntegrationDataKeySecret}:key::',
              }
          HealthCheck:
            Command:
              [
                CMD-SHELL,
                'node -e "fetch(''http://127.0.0.1:3000/readyz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
              ]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          ReadonlyRootFilesystem: false
          LinuxParameters: { InitProcessEnabled: true }
          StopTimeout: 30
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          Command: [pnpm, --filter, '@cpf/web', start, --, -H, 0.0.0.0, -p, '4300']
          DependsOn:
            - { ContainerName: api, Condition: HEALTHY }
          PortMappings:
            - { ContainerPort: 4300, Protocol: tcp, Name: web }
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: APP_ENV, Value: !Ref EnvironmentName }
            - { Name: CPF_DEMO_MODE, Value: !If [IsUat, 'true', 'false'] }
            - { Name: CPF_DEMO_PERSISTENCE, Value: !If [IsUat, 'true', 'false'] }
            - { Name: CPF_API_BASE_URL, Value: 'http://127.0.0.1:3000' }
            - { Name: CPF_SESSION_COOKIE_SECURE, Value: !If [HasCertificate, 'true', 'false'] }
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: cpf }
            - { Name: PGSSL, Value: 'true' }
            - {
                Name: PGSSLROOTCERT,
                Value: /usr/local/share/ca-certificates/aws-rds-global-bundle.pem,
              }
            - { Name: PGPOOL_MAX, Value: '10' }
            - { Name: PGAPPNAME, Value: cpf-web }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${ApplicationDatabaseSecret}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${ApplicationDatabaseSecret}:password::' }
          HealthCheck:
            Command:
              [
                CMD-SHELL,
                'node -e "fetch(''http://127.0.0.1:4300/sign-in'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
              ]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          ReadonlyRootFilesystem: false
          LinuxParameters: { InitProcessEnabled: true }
          StopTimeout: 30

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-migration'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref ImageUri
          Essential: true
          Command: [node, packages/db/scripts/migrate-release.mjs]
          Environment:
            - { Name: APP_ENV, Value: !Ref EnvironmentName }
            - { Name: MASTER_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: MASTER_DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: MASTER_DB_NAME, Value: cpf }
            - { Name: PGSSL, Value: 'true' }
            - {
                Name: PGSSLROOTCERT,
                Value: /usr/local/share/ca-certificates/aws-rds-global-bundle.pem,
              }
            - { Name: CPF_UAT_CREDENTIALS_DIR, Value: /tmp/cpf-uat-credentials }
          Secrets:
            - {
                Name: MASTER_DB_USER,
                ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::',
              }
            - {
                Name: MASTER_DB_PASSWORD,
                ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::',
              }
            - { Name: APP_DB_PASSWORD, ValueFrom: !Sub '${ApplicationDatabaseSecret}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-worker'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Command: [node, apps/worker/node_modules/tsx/dist/cli.mjs, apps/worker/src/run.ts]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: APP_ENV, Value: !Ref EnvironmentName }
            - { Name: CPF_EVENT_PUBLISHER, Value: !If [IsUat, log, eventbridge] }
            - { Name: CPF_EVENT_BUS_NAME, Value: !Ref EventBus }
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: cpf }
            - { Name: PGSSL, Value: 'true' }
            - {
                Name: PGSSLROOTCERT,
                Value: /usr/local/share/ca-certificates/aws-rds-global-bundle.pem,
              }
            - { Name: PGPOOL_MAX, Value: '5' }
            - { Name: PGAPPNAME, Value: cpf-worker }
            - { Name: CPF_OUTBOX_BATCH_SIZE, Value: '50' }
            - { Name: CPF_OUTBOX_POLL_MS, Value: '1000' }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${ApplicationDatabaseSecret}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${ApplicationDatabaseSecret}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          ReadonlyRootFilesystem: false
          LinuxParameters: { InitProcessEnabled: true }
          StopTimeout: 60

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
        - { Key: routing.http.xff_client_port.enabled, Value: 'true' }
        - { Key: deletion_protection.enabled, Value: !If [ProtectDatabase, 'true', 'false'] }
        - { Key: idle_timeout.timeout_seconds, Value: '60' }
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 4300
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /sign-in
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200-399' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
            Type: redirect
          - TargetGroupArn: !Ref WebTargetGroup
            Type: forward
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref WebTargetGroup }

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}'
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${EnvironmentName}-waf'
        SampledRequestsEnabled: true
      Rules:
        - Name: AwsCommonRuleSet
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: common
            SampledRequestsEnabled: true
        - Name: AwsKnownBadInputs
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: bad-inputs
            SampledRequestsEnabled: true
        - Name: RateLimit
          Priority: 2
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 2000
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit
            SampledRequestsEnabled: true
  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  ApplicationService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-${EnvironmentName}-application'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApplicationTaskDefinition
      DesiredCount: !Ref DesiredCount
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 180
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: FARGATE, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApplicationSecurityGroup]
          Subnets: [!Ref ApplicationSubnetA, !Ref ApplicationSubnetB]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 4300
          TargetGroupArn: !Ref WebTargetGroup

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-${EnvironmentName}-worker'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref WorkerDesiredCount
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      CapacityProviderStrategy:
        - { CapacityProvider: FARGATE, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApplicationSecurityGroup]
          Subnets: [!Ref ApplicationSubnetA, !Ref ApplicationSubnetB]

  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 20
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${ApplicationService.Name}'
      RoleARN: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-${EnvironmentName}-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${EnvironmentName}-alerts'
      KmsMasterKeyId: alias/aws/sns
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-unhealthy-targets'
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt WebTargetGroup.TargetGroupFullName }
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  TargetErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-target-5xx'
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-database-cpu'
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-database-storage'
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Database }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10737418240
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${EnvironmentName}'
      DashboardBody: !Sub |
        {"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Application load balancer","region":"${AWS::Region}","metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${LoadBalancer.LoadBalancerFullName}"],[".","HTTPCode_Target_5XX_Count",".","."]] }},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"PostgreSQL","region":"${AWS::Region}","metrics":[["AWS/RDS","CPUUtilization","DBInstanceIdentifier","${Database}"],[".","DatabaseConnections",".","."],[".","FreeStorageSpace",".","."]]}}]}

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  ApplicationUrl:
    Value:
      !If [
        HasDomainName,
        !Sub 'https://${DomainName}',
        !If [
          HasCertificate,
          !Sub 'https://${LoadBalancer.DNSName}',
          !Sub 'http://${LoadBalancer.DNSName}',
        ],
      ]
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt ApplicationService.Name
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  ApplicationSubnetIds:
    Value: !Join [',', [!Ref ApplicationSubnetA, !Ref ApplicationSubnetB]]
  ApplicationSecurityGroupId:
    Value: !Ref ApplicationSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  AlertTopicArn:
    Value: !Ref AlertTopic
  UatSeedAllowed:
    Value: !If [IsUat, 'true', 'false']
