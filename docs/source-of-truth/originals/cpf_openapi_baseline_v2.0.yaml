      operationId: post_auth_login
      tags:
      - Authentication
      summary: Authenticate a staff or candidate account
      description: 'Authorised roles: Public. Server policy remains authoritative.'
      x-required-roles:
      - Public
      x-requirement-ids:
      - FR-ACC-01
      - FR-IAM-03
      x-human-decision-required: false
      x-audit-event: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      security: []
      responses:
        '200':
          description: Successful authorised response
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
