components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived staff access token with tenant and role context
    candidateBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Invitation-bound candidate access token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  headers:
    CorrelationId:
      description: End-to-end trace identifier
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457-style error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
    Error:
      $ref: '#/components/schemas/ProblemDetails'
    GenericRecord:
      type: object
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    GenericCommand:
      type: object
      properties:
        reason:
          type: string
          maxLength: 2000
        expectedVersion:
          type: integer
          minimum: 0
        data:
          type: object
          additionalProperties: true
    AIMessage:
      allOf:
      - $ref: '#/components/schemas/GenericRecord'
      description: AIMessage response projection; fields are purpose- and role-filtered.
