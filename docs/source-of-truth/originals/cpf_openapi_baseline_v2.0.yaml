openapi: 3.1.0
info:
  title: CPF AI-Native Hiring Assessment Platform API
  version: '2.0'
  description: Contract baseline for a human-decision employment assessment platform. AI may create labelled observations,
    never candidate scores, ranks, progression values or integrity verdicts.
  contact:
    name: CPF Product and Compliance
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.example.cpf.eu/v2
  description: Illustrative EU production base URL
