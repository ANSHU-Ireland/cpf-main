name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests + coverage
        run: pnpm exec vitest run --coverage

  # DB integration / RLS tests run only where a Postgres service is available (EXT-01).
  # A dedicated job with a postgres service container will be enabled once the db package
  # lands; until then the unit suite above is authoritative for CI green.
